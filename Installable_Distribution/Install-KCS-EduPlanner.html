<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Install KCS EduPlanner</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fb;
        color: #102033;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(560px, 100%);
        border: 1px solid #d8e0ea;
        border-radius: 8px;
        background: #ffffff;
        padding: 28px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(16, 32, 51, 0.12);
      }

      img {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }

      h1 {
        margin: 16px 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0 auto 18px;
        max-width: 440px;
        line-height: 1.5;
      }

      a {
        display: inline-block;
        border-radius: 6px;
        background: #075985;
        color: #ffffff;
        font-weight: 700;
        padding: 12px 18px;
        text-decoration: none;
      }

      small {
        display: block;
        margin-top: 18px;
        color: #52677d;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="Icons/kcs-icon-512.png" alt="KCS logo" />
      <h1>KCS EduPlanner</h1>
      <p>Open the app, then use your browser's install option to add it to your computer, phone, or tablet with the school logo.</p>
      <a href="https://propheticpowerfulman.github.io/LessonPlanPowerfullyDone/">Open installable app</a>
      <small>Desktop: Chrome or Edge install button. Android: Chrome menu, Install app. iPhone/iPad: Safari share menu, Add to Home Screen.</small>
    </main>
  </body>
</html>
